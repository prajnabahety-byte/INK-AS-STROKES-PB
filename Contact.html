<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact</title>

<style>

body{
    font-family:"Merriweather", Georgia, serif;
    margin:0;
    padding:0;
    background-image:url('https://assets.science.nasa.gov/dynamicimage/assets/science/astro/exo-explore/internal_resources/details/original/1795_1585_what-is-exoplanet-banner.jpg?w=1280&h=550&fit=clip&crop=faces%2Cfocalpoint');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:white;
}

/* dark overlay for readability */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,30,0.65);
    z-index:-1;
}

header{
    text-align:center;
    padding:2rem;
    background:rgba(10,10,40,0.85);
    border-bottom:2px solid #7aa6ff;
}

header h1{
    margin:0;
    font-size:2.8rem;
    letter-spacing:2px;
    text-shadow:0 0 10px #7aa6ff;
}

main{
    padding:3rem;
    display:flex;
    justify-content:center;
}

table{
    border-collapse:collapse;
    width:60%;
    max-width:600px;
    background:rgba(0,0,20,0.8);
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 15px rgba(0,0,0,0.6);
}

thead{
    background:#1f2b60;
}

th, td{
    padding:15px;
    text-align:center;
    font-size:1.1rem;
}

th{
    letter-spacing:1px;
}

tbody tr{
    transition:0.3s;
}

tbody tr:hover{
    background:#2a3a7a;
}

footer{
    text-align:center;
    padding:1.5rem;
    background:rgba(10,10,40,0.85);
    margin-top:2rem;
}

</style>

</head>

<body>

<header>
<h1>Contact</h1>
</header>

<main>

<table>

<thead>
<tr>
<th>Email ID</th>
</tr>
</thead>

<tbody>
<tr>
<td>prajnabahety@gmail.com</td>
</tr>
</tbody>

</table>

</main>

<footer>
Thank you!
</footer>

</body>
</html>
