    <style>
        body {
            font-family: "Merriweather", Georgia, serif;
            margin: 0;
            padding: 0;
            color: #1b3c2d;
            min-height: 100vh;
            background: url('https://media.istockphoto.com/id/1093110112/photo/picturesque-morning-in-plitvice-national-park-colorful-spring-scene-of-green-forest-with-pure.jpg?s=612x612&w=0&k=20&c=lpQ1sQI49bYbTp9WQ_EfVltAqSP1DXg0Ia7APTjjxz4=') no-repeat center center fixed;
            background-size: cover;
            position: relative;
        }

        /* Softer overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(255, 255, 255, 0.3); /* light transparent layer */
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background-color: rgba(46, 125, 50, 0.85); /* forest green with softer opacity */
            color: #fff;
        }

        header h1 {
            font-size: 3.5rem;
            margin: 0;
            letter-spacing: 2px;
        }

        hr {
            border: none;
            height: 3px;
            background-color: #1b5e20;
            margin: 0;
        }

        main {
            padding: 3rem;
            text-align: center;
        }

        main p {
            font-size: 1.4rem;
            margin-bottom: 2rem;
            color: #000000;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 1rem 0;
        }

        ul a {
            text-decoration: none;
            font-size: 1.3rem;
            color: #fff;
            background-color: #388e3c;
            padding: 0.8rem 1.5rem;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-weight: bold;
            display: inline-block;
        }

        ul a:hover {
            background-color: #1b5e20;
            color: #fff;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
            transform: translateY(-3px);
        }
    </style>
</head>
