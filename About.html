<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>About the Poet</title>

<style>

body{
    font-family:"Merriweather", Georgia, serif;
    margin:0;
    padding:0;
    background-image:url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3XyI6LMF94Y4m4xyuXvnFSMBn6_PmFpDblw&s');
    background-size:cover;
    background-position:center;
    background-attachment:fixed;
    color:#1f1f1f;
}

/* overlay */

body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(255,255,255,0.75);
    z-index:-1;
}

header{
    text-align:center;
    padding:2rem;
    background:rgba(50,50,50,0.85);
    color:white;
}

header h1{
    margin:0;
    font-size:2.8rem;
    letter-spacing:2px;
}

main{
    padding:3rem;
    display:flex;
    justify-content:center;
}

table{
    border-collapse:collapse;
    width:85%;
    max-width:900px;
    background:rgba(255,255,255,0.9);
    box-shadow:0 0 15px rgba(0,0,0,0.25);
    border-radius:8px;
    overflow:hidden;
}

thead{
    background:#444;
    color:white;
}

th, td{
    padding:14px;
    text-align:center;
}

th{
    font-size:1.1rem;
    letter-spacing:1px;
}

tbody tr{
    transition:0.3s;
}

tbody tr:hover{
    background:#f2f2f2;
}

footer{
    text-align:center;
    padding:1.5rem;
    font-size:1.1rem;
    background:rgba(50,50,50,0.85);
    color:white;
}

</style>
</head>

<body>

<header>
<h1>About the Poet</h1>
</header>

<main>

<table>

<thead>
<tr>
<th>First Name</th>
<th>Last Name</th>
<th>Age</th>
<th>State</th>
<th>Country</th>
<th>Favourite Poem</th>
</tr>
</thead>

<tbody>
<tr>
<td>Prajna</td>
<td>Bahety</td>
<td>15</td>
<td>Assam</td>
<td>India</td>
<td>"The Road Not Taken" by Robert Frost</td>
</tr>
</tbody>

</table>

</main>

<footer>
Thank you!
</footer>

</body>
</html>
