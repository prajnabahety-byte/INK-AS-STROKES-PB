<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ink as Strokes</title>
    <style>
        body {
            font-family: "Times New Roman", "Palatino Linotype", "Book Antiqua", serif;
            margin: 0;
            padding: 0;
            color: #2c2c2c;
            background: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e') no-repeat center center fixed;
            background-size: cover;
        }

        /* Gradient overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(245, 235, 224, 0.9), rgba(212, 163, 115, 0.7));
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 2rem 1rem;
            color: #3e2f1c;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 1px;
        }

        header h2 {
            font-size: 1.6rem;
            font-style: italic;
            margin-top: 0.5rem;
        }

        hr {
            border: none;
            height: 2px;
            background: #6b4226;
            margin: 0;
        }

        main {
            padding: 2rem;
            text-align: center;
        }

        main h1 {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: #6b4226;
        }

        .nav-links {
            margin-bottom: 1.5rem;
        }

        .nav-links a {
            text-decoration: none;
            font-size: 1.2rem;
            color: #fff;
            background: #6b4226;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            margin: 0 0.5rem;
            transition: all 0.3s ease;
        }

        .nav-links a:hover {
            background: #d4a373;
            color: #2c2c2c;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 1rem 0;
        }

        ul a {
            text-decoration: none;
            font-size: 1.3rem;
            color: #6b4226;
            background: rgba(245, 235, 224, 0.9);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        ul a:hover {
            background: #d4a373;
            color: #fff;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        footer {
            background: rgba(107, 66, 38, 0.9);
            color: #fff;
            text-align: center;
            padding: 1rem;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 1rem;
            letter-spacing: 0.5px;
        }

        #clock {
            font-size: 1.2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Self-composed Poems Compilation</h1>
        <h2>by Prajna Bahety</h2>
    </header>
    <hr>
    <main>
        <div>
            <h1>Choose a Genre</h1>
        </div>
        <div class="nav-links">
            <a href='About.html' target="_blank">About the Poet</a>
            <a href='Contact.html' target="_blank">Contact</a>
        </div>
        <div>
            <ul>
                <li><a href='Nature_genre.html' target="_blank">🌿 Nature</a></li>
                <li><a href='Sci_Fi_Post_Apocalyptic_Genre.html' target="_blank">🚀 Sci‑Fi / Post‑Apocalyptic</a></li>
                <li><a href='Time_philosophy_genre.html' target="_blank">🕰️ Time & Philosophical</a></li>
                <li><a href='Nostalgia_Memory_genre.html' target="_blank">🕰️ Nostalgia / Memory</a></li>
                <li><a href='Playful_Musical_Genre.html' target="_blank">🎶 Playful / Musical</a></li>
            </ul>
        </div>
    </main>
    <footer>
        <div id="clock"></div>
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('en-US', options);
            const timeStr = now.toLocaleTimeString('en-US');
            document.getElementById('clock').textContent = dateStr + " | " + timeStr;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>

</html>
