<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        body {
            font-family: "Orbitron", "Courier New", monospace;
            margin: 0;
            padding: 0;
            color: #e0e0e0;
            background-color: #0d0d0d;
            background-image: url('https://images.unsplash.com/photo-1581090700227-4c4d1a3a5d3b'); /* futuristic space background */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            position: relative;
        }

        /* Overlay for readability */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(13, 13, 13, 0.7);
            z-index: -1;
        }

        header {
            text-align: center;
            padding: 3rem 1rem;
            background-color: rgba(20, 20, 20, 0.85);
            color: #00ffcc;
            border-bottom: 3px solid #ff0040;
        }

        header h1 {
            font-size: 3rem;
            margin: 0;
            letter-spacing: 3px;
            text-shadow: 0 0 15px #00ffcc, 0 0 25px #ff0040;
        }

        hr {
            border: none;
            height: 2px;
            background-color: #ff0040;
            margin: 0;
        }

        main {
            padding: 3rem;
            text-align: center;
        }

        main p {
            font-size: 1.3rem;
            margin-bottom: 2rem;
            color: #e0e0e0;
            max-width: 700px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            margin: 1.2rem 0;
        }

        ul a {
            text-decoration: none;
            font-size: 1.2rem;
            color: #fff;
            background-color: #1a1a1a;
            border: 2px solid #00ffcc;
            padding: 0.8rem 1.5rem;
            border-radius: 8px;
            transition: all 0.3s ease;
            font-weight: bold;
            display: inline-block;
            text-shadow: 0 0 8px #00ffcc;
        }

        ul a:hover {
            background-color: #00ffcc;
            color: #0d0d0d;
            box-shadow: 0 0 15px #00ffcc, 0 0 25px #ff0040;
            transform: translateY(-3px);
        }
    </style>
</head>

<body>
